name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit all local Lean sources for admissions and axioms
        run: python3 scripts/audit_source_integrity.py

      - name: Audit complete exported theorem axiom reports
        run: |
          mkdir -p proof-audit
          lake env lean scripts/CheckAxioms.lean > proof-audit/axioms.log 2>&1
          python3 scripts/check_axiom_log.py proof-audit/axioms.log scripts/CheckAxioms.lean

      - name: Exhaustive finite auxiliary encoding regression
        run: python3 scripts/check_finite_aux_encoding.py

      - name: Exhaustive finite exact-meet interface regression
        run: python3 scripts/check_finite_exact_meets.py
