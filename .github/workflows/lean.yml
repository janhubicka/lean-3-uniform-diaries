name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit exported theorem axioms
        run: |
          mkdir -p proof-audit
          lake env lean scripts/CheckAxioms.lean > proof-audit/axioms.log 2>&1
          cat proof-audit/axioms.log
          if grep -q 'sorryAx' proof-audit/axioms.log; then
            echo "Unexpected sorryAx dependency"
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path

          output = Path("proof-audit/axioms.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          reported = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output, re.S)
          if not reported and "does not depend on any axioms" not in output:
              raise SystemExit("No axiom audit results were produced")
          actual = {name.strip() for group in reported
                    for name in group.split(",") if name.strip()}
          unexpected = actual - allowed
          if unexpected:
              raise SystemExit("Unexpected Lean axioms: " +
                               ", ".join(sorted(unexpected)))
          print(f"Axiom audit passed: only {sorted(actual)}")
          PY

      - name: Reject placeholders
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b' ThreeUniformDiaries ThreeUniformDiaries.lean scripts; then
            echo "Found unfinished proof placeholder"
            exit 1
          fi

      - name: Exhaustive finite auxiliary encoding regression
        run: python3 scripts/check_finite_aux_encoding.py
